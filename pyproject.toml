[project]
name = "backend"
version = "0.1.0"
description = "Candor Foods — SO Upload & Extraction Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.42.0",
    "python-multipart==0.0.22",
    "asyncpg==0.31.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "rapidfuzz==3.14.3",
    "openpyxl==3.1.5",
    "anthropic==0.86.0",
    "cryptography==44.0.3",
    "httpx==0.28.1",
    "mcp==1.26.0",
    "requests==2.33.1",
    "pandas==3.0.2",
    "pyjwt[crypto]>=2.10.1,<3.0",
    "mangum==0.19.0",
    "bcrypt==4.2.1",
    "fpdf2==2.8.3",
    "qrcode[pil]==8.2",
    "boto3==1.38.0",
    "dotenv>=0.9.9",
    "python-dotenv==1.1.0",
    "reportlab==4.4.0",
    "pillow==12.2.0",
]

# Test-only dependencies. Deliberately NOT in requirements.txt — the Dockerfile
# pip-installs that file into the runtime image, and a test runner has no place
# there. Install with `uv sync --group test`, or
# `pip install "pytest>=9.1.1" "pytest-asyncio>=1.4.0" "pglast>=8.4"`.
#
# pglast is used by tests/services/test_ledger_leaves.py to parse the generated
# ledger SQL. It is optional: those specific tests skip without it while the rest
# of the file still runs.
[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pglast>=8.4",
]
